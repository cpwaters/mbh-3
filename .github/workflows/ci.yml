name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A manual "Run workflow" button. GitHub stopped creating runs for this repo
  # on 2026-08-26 — a merge to main landed and no run appeared, so the deploy
  # never fired and there was nothing to re-run. This gives a way to start one
  # by hand instead of pushing an empty commit to provoke it.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A new push supersedes an unfinished PR run. Without this, one hung job
  # (a `playwright install` that stalled on a slow runner, 2026-08-19) holds
  # the group and leaves every later run on the branch queued until GitHub's
  # 6-hour default timeout. Pushes to main are never cancelled — that run
  # feeds the deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # The full sweep runs in ~5 minutes; anything past 25 is a stuck runner,
    # and failing is more useful than squatting on the concurrency group.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Version comes from the packageManager field in package.json —
      # specifying it here too makes pnpm/action-setup fail on the conflict.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Firestore emulator needs a JDK; ubuntu-latest ships one but pin it.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @mbh/functions typecheck
      - run: pnpm check:web
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:web
      - run: pnpm test:rules
      - run: pnpm test:contract
      - run: pnpm test:functions
      - run: pnpm seed
      - run: pnpm build
      # Storybook must build (catches broken component stories). No emulator.
      - run: pnpm build-storybook
      # E2E browser journeys against the FULL emulator stack (auth + firestore +
      # functions + hosting). run-e2e.sh builds the emulator bundle, runs the
      # journeys, and restores the prod bundle. Needs chromium + the JDK above.
      - run: pnpm --filter @mbh/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Responsive / device visual review (widths + iPhone/Pixel/iPad),
      # asserting no horizontal overflow across the whole page set.
      - run: pnpm test:visual

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    # Only from main, and only when the repo variable is explicitly enabled.
    # workflow_dispatch counts: a manual run is the fallback when a push does
    # not produce one, and it would be useless if it validated and then skipped
    # the deploy. Running it needs write access to the repo, and the ref check
    # above still means main only.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.PRODUCTION_DEPLOY == 'true'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # required for keyless Workload Identity Federation
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # apps/web/dist for hosting (functions build in predeploy)
      # Keyless auth — no service-account keys. The WIF provider's attribute
      # condition pins this repo; the repo variables come from terraform output.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      # Point the drain at a self-hosted OSRM when configured (else the code
      # default — the public demo server — applies). Not a secret; a plain URL.
      - run: |
          if [ -n "${{ vars.OSRM_BASE_URL }}" ]; then
            echo "OSRM_BASE_URL=${{ vars.OSRM_BASE_URL }}" >> functions/.env
            echo "drain -> OSRM ${{ vars.OSRM_BASE_URL }}"
          fi
      # SMTP connection details for the invoice email — host/port/from are not
      # secret (repo VARIABLES); user/password are (repo SECRETS — encrypted,
      # GitHub masks them in all logs). See composition.ts for why this is a
      # plain env var rather than Secret Manager for now.
      - run: |
          if [ -n "${{ vars.SMTP_HOST }}" ]; then
            echo "SMTP_HOST=${{ vars.SMTP_HOST }}" >> functions/.env
            echo "SMTP_PORT=${{ vars.SMTP_PORT }}" >> functions/.env
            echo "SMTP_FROM=${{ vars.SMTP_FROM }}" >> functions/.env
            echo "drain -> SMTP ${{ vars.SMTP_HOST }}"
          fi
          if [ -n "${{ secrets.SMTP_USER }}" ]; then
            echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> functions/.env
            echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> functions/.env
          fi
      - run: pnpm exec firebase deploy --only functions,hosting,firestore --project mybackhaul-app --non-interactive
      - run: pnpm smoke:prod
        env:
          SMOKE_BASE_URL: https://mybackhaul-app.web.app
