# Builds the self-contained OSRM image (Great Britain graph baked in) and
# pushes it to Artifact Registry. Heavy: osrm-extract for GB needs a lot of
# RAM, so this runs on a high-memory machine and can take 30-45 minutes.
#
#   gcloud builds submit --config infrastructure/osrm/cloudbuild.yaml \
#     --substitutions=_IMAGE=europe-west2-docker.pkg.dev/mybackhaul-app/osrm/osrm-gb:latest \
#     infrastructure/osrm
#
# See docs/runbooks/osrm.md.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_IMAGE}', '-f', 'Dockerfile', '.']
images:
  - '${_IMAGE}'
timeout: '3600s'
options:
  machineType: 'E2_HIGHCPU_32' # 32 vCPU / 32GB RAM — enough for the GB extract
  diskSizeGb: 200
substitutions:
  _IMAGE: 'europe-west2-docker.pkg.dev/mybackhaul-app/osrm/osrm-gb:latest'
